<!DOCTYPE html>
<html lang="hy" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Regiscode — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-8">

  <div class="max-w-7xl mx-auto space-y-8">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-3xl font-bold">Leads Admin Panel</h1>
        <p class="text-slate-400 text-sm">Մուտքային հայտեր և հաճախորդների կառավարում</p>
      </div>
      <div class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2 rounded-xl text-sm font-semibold">
        WhatsApp: +37433488275
      </div>
    </div>

    <!-- Leads Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="bg-slate-950 text-xs font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-800">
          <tr>
            <th class="p-4">Անուն</th>
            <th class="p-4">Հեռախոս</th>
            <th class="p-4">Տեսակ</th>
            <th class="p-4">Ոլորտ</th>
            <th class="p-4">Լսարան</th>
            <th class="p-4">Գործողություն</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody" class="divide-y divide-slate-800">
          <!-- Dynamically populated from Firestore -->
        </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
