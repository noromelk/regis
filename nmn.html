<!DOCTYPE html>
<html lang="hy" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Regiscode — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 sm:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-6 gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold">Leads Admin Panel</h1>
        <p class="text-slate-400 text-sm">Մուտքային հայտեր և հաճախորդների կառավարում</p>
      </div>
      <div class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2 rounded-xl text-sm font-semibold">
        WhatsApp: +37433488275
      </div>
    </div>

    <div class="flex flex-wrap gap-2 pt-2" id="filterContainer">
      <button data-filter="all" class="filter-btn active bg-brand-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-brand-500 border border-brand-500">
        Բոլորը
      </button>
      <button data-filter="Ուսումնասիրում" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition">
        Ուսումնասիրում
      </button>
      <button data-filter="Կոդավորում" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition">
        Կոդավորում
      </button>
      <button data-filter="Ավարտված" class="filter-btn bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-800 transition">
        Ավարտված
      </button>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-x-auto shadow-xl">
      <table class="w-full text-left text-sm text-slate-300 min-w-[800px]">
        <thead class="bg-slate-950 text-xs font-semibold uppercase tracking-wider text-slate-400 border-b border-slate-800">
          <tr>
            <th class="p-4">Անուն</th>
            <th class="p-4">Հեռախոս</th>
            <th class="p-4">Տեսակ</th>
            <th class="p-4">Ոլորտ</th>
            <th class="p-4">Լսարան</th>
            <th class="p-4">Փուլ (Status)</th>
            <th class="p-4">Գործողություն</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody" class="divide-y divide-slate-800">
          </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
